<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <title>GoFile 个人网盘</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#74b9ff,#a29bfe);min-height:100vh;color:#fff}
        .navbar{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:rgba(255,255,255,.15);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.25)}
        .navbar .brand{font-size:20px;font-weight:700;letter-spacing:1px}
        .navbar .user-area{display:flex;align-items:center;gap:16px;font-size:14px}
        .navbar .btn-logout{padding:6px 14px;border-radius:8px;cursor:pointer;background:transparent;color:#fff;font-size:13px;border:1px solid rgba(255,255,255,.6);transition:background .2s}
        .navbar .btn-logout:hover{background:rgba(255,255,255,.2)}
        .container{max-width:860px;margin:36px auto;padding:0 20px 60px}
        .upload-card,.file-card{background:rgba(255,255,255,.2);backdrop-filter:blur(18px);border-radius:20px;box-shadow:0 8px 25px rgba(0,0,0,.18);padding:32px 36px;margin-bottom:30px;animation:fadeIn .6s ease-in-out}
        @keyframes fadeIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
        .upload-card h3,.file-card h3{margin-bottom:18px;font-weight:600;font-size:17px}
        .drop-zone{border:2px dashed rgba(255,255,255,.55);border-radius:14px;padding:40px 20px;text-align:center;cursor:pointer;transition:background .2s,border-color .2s;margin-bottom:14px}
        .drop-zone:hover,.drop-zone.dragover{background:rgba(255,255,255,.12);border-color:#fff}
        .drop-zone p{font-size:15px;opacity:.92}
        .drop-zone .hint{font-size:12px;opacity:.65;margin-top:6px}
        .drop-zone input[type=file]{display:none}
        .upload-actions{display:flex;gap:12px;align-items:center}
        .btn{padding:10px 20px;background:linear-gradient(135deg,#0984e3,#00cec9);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:transform .2s,box-shadow .3s}
        .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,0,0,.3)}
        .btn:disabled{opacity:.55;cursor:not-allowed}
        .btn-ghost{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4)}
        .upload-progress{display:none;margin-top:16px}
        .upload-progress.active{display:block}
        .progress-info{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
        .progress-bar{width:100%;height:8px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
        .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#00cec9,#0984e3);transition:width .3s ease}
        table{width:100%;border-collapse:collapse;border-radius:12px;overflow:hidden;text-align:center;font-size:14px}
        th,td{padding:12px 10px;background:rgba(255,255,255,.12)}
        th{background:rgba(0,0,0,.2);font-weight:600}
        tr:hover td{background:rgba(255,255,255,.22)}
        .col-name{text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .col-actions{white-space:nowrap}
        .col-actions a,.col-actions button{display:inline-block;margin:0 3px;padding:4px 10px;border-radius:6px;font-size:12px;text-decoration:none;cursor:pointer;border:none;color:#fff;transition:background .2s}
        .op-download{background:rgba(0,206,201,.7)}.op-download:hover{background:rgba(0,206,201,1)}
        .op-rename{background:rgba(9,132,227,.7)}.op-rename:hover{background:rgba(9,132,227,1)}
        .op-delete{background:rgba(214,48,49,.7)}.op-delete:hover{background:rgba(214,48,49,1)}
        .empty-hint{text-align:center;padding:40px 10px;opacity:.75;font-size:14px}
        #toast-container{position:fixed;bottom:28px;right:28px;z-index:9999;display:flex;flex-direction:column;gap:10px}
        .toast{padding:12px 20px;border-radius:10px;color:#fff;font-size:14px;min-width:220px;max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:toastIn .3s ease;word-break:break-word}
        .toast.success{background:#00b894}.toast.error{background:#d63031}.toast.warning{background:#fdcb6e;color:#333}
        @keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        .toast.hiding{animation:toastOut .3s ease forwards}
        @keyframes toastOut{to{opacity:0;transform:translateY(12px)}}
        .modal-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:center}
        .modal-mask.active{display:flex}
        .modal{background:rgba(255,255,255,.95);color:#333;border-radius:16px;padding:28px 32px;width:90%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:fadeIn .25s ease}
        .modal h4{font-size:17px;margin-bottom:18px;color:#2d3436}
        .modal input[type=text]{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #ccc;font-size:14px;outline:none}
        .modal input[type=text]:focus{border-color:#0984e3;box-shadow:0 0 0 3px rgba(9,132,227,.15)}
        .modal .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
        .modal .btn{padding:8px 18px;font-size:13px}
        .modal .btn-ghost{background:#dfe6e9;color:#333;border:none}
        .modal .warning-text{font-size:13px;color:#d63031;margin-top:8px}
        @media(max-width:700px){
            .navbar{padding:12px 16px}.navbar .brand{font-size:17px}
            .upload-card,.file-card{padding:22px 18px}
            table,thead,tbody,th,td,tr{display:block}thead{display:none}
            table tr{margin-bottom:12px;background:rgba(255,255,255,.15);border-radius:12px;padding:12px}
            table td{background:transparent;text-align:left;padding:6px 0;display:flex;justify-content:space-between;gap:10px}
            table td::before{content:attr(data-label);font-weight:600;opacity:.75;flex-shrink:0;min-width:70px}
            table td.col-name{max-width:none;white-space:normal;word-break:break-all}
            .col-actions{text-align:right;padding-top:10px}.col-actions::before{display:none}
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="brand">GoFile</div>
    <div class="user-area">
        <span class="username" id="nav-username">加载中…</span>
        <button class="btn-logout" id="btn-logout">退出登录</button>
    </div>
</nav>
<div class="container">
    <div class="upload-card">
        <h3>📤 上传文件</h3>
        <div class="drop-zone" id="drop-zone">
            <p>拖拽文件到此处，或点击选择文件</p>
            <p class="hint">支持任意类型 · 10MB 以上自动分片断点续传</p>
            <input type="file" id="file-input">
        </div>
        <div class="upload-actions">
            <button class="btn" id="btn-upload" disabled>开始上传</button>
            <button class="btn btn-ghost" id="btn-cancel" style="display:none;">取消</button>
        </div>
        <div class="upload-progress" id="upload-progress">
            <div class="progress-info"><span id="progress-name">—</span><span id="progress-text">0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
    </div>
    <div class="file-card">
        <h3>📁 我的文件</h3>
        <table id="file-table">
            <thead><tr><th class="col-name">文件名</th><th>大小</th><th>上传时间</th><th class="col-actions">操作</th></tr></thead>
            <tbody id="file-tbody"><tr><td colspan="4" class="empty-hint">正在加载…</td></tr></tbody>
        </table>
    </div>
</div>
<div id="toast-container"></div>
<div class="modal-mask" id="delete-modal">
    <div class="modal">
        <h4>删除文件</h4>
        <p>确定要删除 <strong id="delete-filename"></strong> 吗？</p>
        <p class="warning-text">文件将被移入回收站，24 小时内可恢复。</p>
        <div class="modal-actions">
            <button class="btn btn-ghost" id="delete-cancel">取消</button>
            <button class="btn" id="delete-confirm" style="background:#d63031;">确认删除</button>
        </div>
    </div>
</div>
<div class="modal-mask" id="rename-modal">
    <div class="modal">
        <h4>重命名文件</h4>
        <input type="text" id="rename-input" placeholder="请输入新文件名" maxlength="200">
        <div class="modal-actions">
            <button class="btn btn-ghost" id="rename-cancel">取消</button>
            <button class="btn" id="rename-confirm">确认</button>
        </div>
    </div>
</div>
<script>
(function(){
    "use strict";
    var CHUNK_SIZE=5*1024*1024, CHUNK_THRESHOLD=10*1024*1024, MAX_FILE=100*1024*1024;

    function toast(msg,type,dur){
        type=type||"success";dur=dur||3000;
        var c=document.getElementById("toast-container"),el=document.createElement("div");
        el.className="toast "+type;el.textContent=msg;c.appendChild(el);
        (function(e){setTimeout(function(){e.classList.add("hiding");e.addEventListener("animationend",function(){e.remove()},{once:true})},dur)})(el);
    }
    function fmtSize(b){
        if(b<1024)return b+" B";
        if(b<1048576)return(b/1024).toFixed(1)+" KB";
        if(b<1073741824)return(b/1048576).toFixed(1)+" MB";
        return(b/1073741824).toFixed(2)+" GB";
    }
    function fmtTime(s){try{return new Date(s).toLocaleString()}catch(e){return s}}
    function apiGet(u){
        return fetch(u,{credentials:"include"}).then(function(r){
            if(r.status===401){goLogin();throw new Error("未登录")}
            return r.json()
        }).then(function(d){if(d.code!==0)throw new Error(d.msg||"请求失败");return d.data});
    }
    function apiPost(u,fd){
        return fetch(u,{method:"POST",body:fd,credentials:"include"}).then(function(r){
            if(r.status===401){goLogin();throw new Error("未登录")}
            return r.json()
        }).then(function(d){if(d.code!==0)throw new Error(d.msg||"操作失败");return d.data});
    }
    function goLogin(){window.location.href="/static/signin.html"}
    function openModal(id){document.getElementById(id).classList.add("active")}
    function closeModal(id){document.getElementById(id).classList.remove("active")}
    document.getElementById("btn-logout").addEventListener("click",goLogin);

    var upProg=document.getElementById("upload-progress"),pFill=document.getElementById("progress-fill"),
        pText=document.getElementById("progress-text"),pName=document.getElementById("progress-name");
    function showProg(n){upProg.classList.add("active");pName.textContent=n||"—";setProg(0)}
    function setProg(p){pFill.style.width=p+"%";pText.textContent=p+"%"}
    function hideProg(){upProg.classList.remove("active")}

    var selectedFile=null,dropZone=document.getElementById("drop-zone"),fileInput=document.getElementById("file-input"),
        btnUpload=document.getElementById("btn-upload"),btnCancel=document.getElementById("btn-cancel");
    dropZone.addEventListener("click",function(){fileInput.click()});
    dropZone.addEventListener("dragover",function(e){e.preventDefault();dropZone.classList.add("dragover")});
    dropZone.addEventListener("dragleave",function(){dropZone.classList.remove("dragover")});
    dropZone.addEventListener("drop",function(e){e.preventDefault();dropZone.classList.remove("dragover");if(e.dataTransfer.files.length)pickFile(e.dataTransfer.files[0])});
    fileInput.addEventListener("change",function(e){if(e.target.files.length)pickFile(e.target.files[0])});
    function pickFile(f){
        if(f.size>MAX_FILE){toast("文件过大，最大支持 100MB","error");fileInput.value="";return}
        selectedFile=f;dropZone.querySelector("p").textContent=f.name+"（"+fmtSize(f.size)+"）";btnUpload.disabled=false;
    }
    function resetUpload(){
        selectedFile=null;fileInput.value="";dropZone.querySelector("p").textContent="拖拽文件到此处，或点击选择文件";
        btnUpload.disabled=true;btnCancel.style.display="none";hideProg();
    }
    function sha1File(file){
        if(file.size<=CHUNK_SIZE)return file.arrayBuffer().then(function(b){return crypto.subtle.digest("SHA-1",b)}).then(bufHex);
        return Promise.all([file.slice(0,CHUNK_SIZE).arrayBuffer(),file.slice(Math.max(0,file.size-CHUNK_SIZE)).arrayBuffer()]).then(function(parts){
            var head=parts[0],tail=parts[1],lenBuf=new Uint8Array(8),dv=new DataView(lenBuf.buffer);
            dv.setUint32(0,Math.floor(file.size/0x100000000));dv.setUint32(4,file.size>>>0);
            var c=new Uint8Array(head.byteLength+tail.byteLength+8);
            c.set(new Uint8Array(head),0);c.set(new Uint8Array(tail),head.byteLength);c.set(lenBuf,head.byteLength+tail.byteLength);
            return crypto.subtle.digest("SHA-1",c);
        }).then(bufHex);
    }
    function bufHex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,"0")}).join("")}

    var cancelReq=false;
    btnUpload.addEventListener("click",function(){
        if(!selectedFile)return;
        btnUpload.disabled=true;btnCancel.style.display="inline-block";
        var p=(selectedFile.size>=CHUNK_THRESHOLD)?uploadChunked(selectedFile):uploadNormal(selectedFile);
        p.catch(function(e){if(e.message!=="cancelled")toast(e.message,"error");resetUpload()});
    });
    btnCancel.addEventListener("click",function(){cancelReq=true;toast("已取消上传","warning")});

    function uploadNormal(file){
        showProg(file.name);
        return new Promise(function(res,rej){
            var fd=new FormData();fd.append("file",file);
            var x=new XMLHttpRequest();x.open("POST","/file/upload");x.withCredentials=true;
            x.upload.onprogress=function(e){if(e.lengthComputable)setProg(Math.round(e.loaded/e.total*100))};
            x.onload=function(){
                if(x.status===401){goLogin();return rej(new Error("未登录"))}
                var d;try{d=JSON.parse(x.responseText)}catch(c){return rej(new Error("服务器响应异常"))}
                d.code===0?res(d.data):rej(new Error(d.msg||"上传失败"));
            };
            x.onerror=function(){rej(new Error("网络错误，请重试"))};
            x.onabort=function(){rej(new Error("cancelled"))};
            x.send(fd);
        }).then(function(){hideProg();toast("上传成功","success");resetUpload();loadFileList()});
    }
    function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
    function uploadSingleChunk(file,hash,idx,retries){
        var blob=file.slice(idx*CHUNK_SIZE,Math.min((idx+1)*CHUNK_SIZE,file.size));
        var fd=new FormData();fd.append("filehash",hash);fd.append("index",String(idx));fd.append("file",blob);
        return apiPost("/file/upload/chunk",fd).catch(function(e){
            if(e.message==="cancelled")throw e;
            return retries>0?wait(1000).then(function(){return uploadSingleChunk(file,hash,idx,retries-1)}):Promise.reject(new Error("分片 "+idx+" 上传失败："+e.message));
        });
    }
    function uploadChunked(file){
        showProg(file.name);cancelReq=false;setProg(0);
        var hash="";
        return sha1File(file).then(function(h){hash=h;return apiGet("/file/meta?filehash="+encodeURIComponent(hash))}).then(function(){
            hideProg();toast("秒传成功","success");resetUpload();loadFileList();return{__end:true};
        },function(e){if(e.message!=="文件不存在")throw e;return null}).then(function(st){
            if(!st||st.__end)return null;
            return apiGet("/file/upload/status?filehash="+encodeURIComponent(hash)).then(function(u){return(u||[]).map(String)},function(){return[]});
        }).then(function(uploaded){
            if(uploaded===null)return null;
            var upSet=new Set(uploaded),total=Math.ceil(file.size/CHUNK_SIZE),done=upSet.size;
            setProg(Math.round(done/total*100));
            var chain=Promise.resolve();
            for(var i=0;i<total;i++)(function(idx){
                chain=chain.then(function(){
                    if(cancelReq)throw new Error("cancelled");
                    if(upSet.has(String(idx)))return;
                    return uploadSingleChunk(file,hash,idx,3).then(function(){upSet.add(String(idx));done++;setProg(Math.round(done/total*100))});
                });
            })(i);
            return chain;
        }).then(function(){
            if(cancelReq)throw new Error("cancelled");
            var fd=new FormData();fd.append("filehash",hash);fd.append("filename",file.name);fd.append("chunks",String(Math.ceil(file.size/CHUNK_SIZE)));
            return apiPost("/file/upload/merge",fd);
        }).then(function(){hideProg();toast("上传成功","success");resetUpload();loadFileList()});
    }

    var tbody=document.getElementById("file-tbody");
    function renderFiles(files){
        tbody.innerHTML="";
        if(!files||!files.length){tbody.innerHTML='<tr><td colspan="4" class="empty-hint">还没有文件，上传一个吧</td></tr>';return}
        files.forEach(function(f){
            var tr=document.createElement("tr");
            var dn=document.createElement("td");dn.className="col-name";dn.textContent=f.filename;dn.title=f.filename;dn.setAttribute("data-label","文件名");
            var ds=document.createElement("td");ds.textContent=fmtSize(f.size);ds.setAttribute("data-label","大小");
            var dt=document.createElement("td");dt.textContent=fmtTime(f.upload_time);dt.setAttribute("data-label","上传时间");
            var op=document.createElement("td");op.className="col-actions";op.setAttribute("data-label","操作");
            var a=document.createElement("a");a.className="op-download";a.textContent="下载";a.href="/file/download?filehash="+encodeURIComponent(f.filehash);
            var br=document.createElement("button");br.className="op-rename";br.textContent="重命名";br.addEventListener("click",function(){openRename(f)});
            var bd=document.createElement("button");bd.className="op-delete";bd.textContent="删除";bd.addEventListener("click",function(){openDelete(f)});
            op.appendChild(a);op.appendChild(br);op.appendChild(bd);
            tr.appendChild(dn);tr.appendChild(ds);tr.appendChild(dt);tr.appendChild(op);tbody.appendChild(tr);
        });
    }
    function loadFileList(){apiGet("/file/query").then(renderFiles).catch(function(e){tbody.innerHTML='<tr><td colspan="4" class="empty-hint">加载失败：'+e.message+"</td></tr>"})}

    var deleteTarget=null;
    function openDelete(f){deleteTarget=f;document.getElementById("delete-filename").textContent=f.filename;openModal("delete-modal")}
    document.getElementById("delete-cancel").addEventListener("click",function(){deleteTarget=null;closeModal("delete-modal")});
    document.getElementById("delete-confirm").addEventListener("click",function(){
        if(!deleteTarget)return;var fh=deleteTarget.filehash,nm=deleteTarget.filename;closeModal("delete-modal");deleteTarget=null;
        var fd=new FormData();fd.append("filehash",fh);
        apiPost("/file/delete",fd).then(function(){toast("“"+nm+"” 已移入回收站","success");loadFileList()}).catch(function(e){toast(e.message,"error")});
    });

    var renameTarget=null,renameExt="";
    function openRename(f){
        renameTarget=f;var idx=f.filename.lastIndexOf(".");
        renameExt=idx>0?f.filename.slice(idx):"";var base=idx>0?f.filename.slice(0,idx):f.filename;
        var inp=document.getElementById("rename-input");inp.value=base;openModal("rename-modal");
        setTimeout(function(){inp.focus();inp.select()},100);
    }
    document.getElementById("rename-cancel").addEventListener("click",function(){renameTarget=null;closeModal("rename-modal")});
    document.getElementById("rename-confirm").addEventListener("click",function(){
        if(!renameTarget)return;var base=document.getElementById("rename-input").value.trim();
        if(!base){toast("文件名不能为空","error");return}
        var nn=base+renameExt,fh=renameTarget.filehash;closeModal("rename-modal");renameTarget=null;
        var fd=new FormData();fd.append("op","0");fd.append("filehash",fh);fd.append("filename",nn);
        apiPost("/file/update",fd).then(function(){toast("已重命名为 “"+nn+"”","success");loadFileList()}).catch(function(e){toast(e.message,"error")});
    });
    document.getElementById("rename-input").addEventListener("keydown",function(e){if(e.key==="Enter")document.getElementById("rename-confirm").click()});

    apiGet("/user/info").then(function(u){document.getElementById("nav-username").textContent=u.Username||u.username||"";loadFileList()}).catch(function(){});
})();
</script>
</body>
</html>
